name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:config
      - run: npm run build
      - name: Install backend dependencies for browser journeys
        working-directory: backend
        run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Run full API workflow smoke test
        env:
          PORT: 3218
          NODE_ENV: development
          DATABASE_PATH: /tmp/nextdoorlearn-ci-smoke.db
          JWT_SECRET: ci-smoke-jwt-secret-with-enough-entropy
          FIELD_ENCRYPTION_KEY: ci-smoke-field-encryption-key
          ALLOW_DIRECT_TUTOR_REGISTRATION: 'true'
        run: |
          npm start > /tmp/nextdoorlearn-ci-smoke.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3218/api/health > /dev/null; then
              break
            fi
            sleep 1
          done

          if ! SMOKE_API_URL=http://127.0.0.1:3218/api npm run smoke; then
            cat /tmp/nextdoorlearn-ci-smoke.log
            exit 1
          fi

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run export:web
