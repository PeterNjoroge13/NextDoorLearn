name: Process reminders

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: nextdoorlearn-production-background-jobs
      cancel-in-progress: false
    steps:
      - name: Process scheduled reminders and queued email
        env:
          JOB_URL: https://nextdoorlearn-backend.onrender.com/api/jobs/process
          JOB_AUDIENCE: nextdoorlearn-background-jobs
        run: |
          oidc_response=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$JOB_AUDIENCE")
          oidc_token=$(printf '%s' "$oidc_response" | node -e \
            "let input='';process.stdin.on('data',c=>input+=c).on('end',()=>{const value=JSON.parse(input).value;if(!value)process.exit(1);process.stdout.write(value)})")
          curl --fail --silent --show-error --retry 3 --connect-timeout 10 --max-time 90 \
            -X POST "$JOB_URL" \
            -H "Authorization: Bearer $oidc_token"
