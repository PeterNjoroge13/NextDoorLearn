services:
  - type: web
    name: nextdoorlearn-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        value: https://nextdoorlearn.com
      - key: CORS_ORIGINS
        value: https://nextdoorlearn.com,https://www.nextdoorlearn.com,https://next-door-learn.vercel.app
      - key: RATE_LIMIT_MAX
        value: 300
      - key: AUTH_RATE_LIMIT_MAX
        value: 30
      - key: PUBLIC_FORM_RATE_LIMIT_MAX
        value: 15
      - key: MESSAGE_RATE_LIMIT_MAX
        value: 30
      - key: SAFETY_ACTION_RATE_LIMIT_MAX
        value: 10
      - key: PAYMENT_RATE_LIMIT_MAX
        value: 20
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://nextdoorlearn-backend.onrender.com/api/google/callback
      - key: ZOOM_ACCOUNT_ID
        sync: false
      - key: ZOOM_CLIENT_ID
        sync: false
      - key: ZOOM_CLIENT_SECRET
        sync: false
      - key: ZOOM_HOST_USER_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: JOB_SECRET
        generateValue: true
      - key: REQUIRE_EMAIL_VERIFICATION
        value: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CONNECTED_ACCOUNT_COUNTRY
        value: US
      - key: STRIPE_PLATFORM_FEE_PERCENT
        value: 0
